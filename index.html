<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little question for Ruchi 🎬</title>
<style>
  :root{ --rose:#ff8fab; --deep:#c65e83; --plum:#6b3e5e; --cream:#fff7f2; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; overflow:hidden;
    font-family:"Segoe UI Rounded","SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;
    color:var(--plum); text-align:center;
    background:linear-gradient(160deg,#ffe3ec 0%,#ffd6c4 55%,#ffeede 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .cutie{ position:fixed; font-size:2rem; opacity:.7; pointer-events:none;
    animation:float linear infinite; }
  @keyframes float{ from{ transform:translateY(105vh) rotate(0);} to{ transform:translateY(-15vh) rotate(360deg);} }
  .card{
    position:relative; z-index:2; background:rgba(255,255,255,.72);
    backdrop-filter:blur(6px); border:2px solid #ffc2d4; border-radius:32px;
    padding:34px 30px; max-width:440px; width:90%;
    box-shadow:0 18px 45px rgba(198,94,131,.28);
  }
  h1{ font-size:1.7rem; margin:.2em 0 .1em; line-height:1.3; }
  .sub{ margin:0 0 18px; color:var(--deep); font-size:.95rem; }
  .movies{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:0 0 22px; }
  .chip{ border:1.5px solid #ffb3c8; background:#fff; color:var(--deep); border-radius:999px;
    padding:7px 13px; font:inherit; font-size:.8rem; cursor:pointer; transition:.15s; }
  .chip:hover{ transform:translateY(-2px); }
  .chip.on{ background:var(--rose); color:#fff; border-color:var(--rose); box-shadow:0 4px 12px rgba(255,143,171,.5); }
  .btns{ display:flex; gap:14px; align-items:center; justify-content:center; min-height:70px; }
  button.act{ border:none; border-radius:999px; cursor:pointer; font:inherit; font-weight:700; color:#fff; transition:.2s; }
  #yes{ background:var(--rose); font-size:1.1rem; padding:12px 26px; box-shadow:0 8px 20px rgba(255,143,171,.5); }
  #yes:hover{ filter:brightness(1.05); }
  #no{ background:#efe6ec; color:#9a8794; font-size:1rem; padding:11px 22px;
    border:3px dashed #b79fb0; transform:rotate(-4deg); box-shadow:4px 4px 0 #d4c2cf;
    font-style:italic; }
  #no:hover{ transform:rotate(5deg) scale(.94); box-shadow:2px 2px 0 #d4c2cf; }
  .heart{ position:fixed; font-size:1.6rem; animation:up 1.3s ease-out forwards; z-index:5; pointer-events:none; }
  @keyframes up{ to{ transform:translateY(-140px) scale(1.4); opacity:0; } }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:2.6rem">🎬🍿</div>
    <h1 id="title">Loduuuuuu… will you go on a movie date with me tonight?</h1>
    <p class="sub" id="hint">pick something you fancy 👇 (or leave it to me 😌)</p>
    <div class="movies" id="movies"></div>
    <div class="btns">
      <button class="act" id="yes" onclick="yay()">Yes! 💕</button>
      <button class="act" id="no" onclick="nope()">No</button>
    </div>
  </div>

<script>
  // floating flowers & teddies
  const cuties = ["🌸","💻","🧸","love you 💕","🌷","💻","🐻","love you 🤍","🖥️","💐","🌼","love you 💕","🧸","💻"];
  for(let i=0;i<16;i++){
    const s=document.createElement("span"); s.className="cutie";
    const txt=cuties[i%cuties.length]; s.textContent=txt;
    const isWord=txt.includes("love");
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(isWord?0.9:1.4)+Math.random()*1.1+"rem";
    if(isWord){ s.style.fontWeight="700"; s.style.color="#e5688a"; s.style.fontStyle="italic"; }
    s.style.animationDuration=(9+Math.random()*8)+"s";
    s.style.animationDelay=(-Math.random()*12)+"s";
    document.body.appendChild(s);
  }

  // movie chips
  const films=["Maa bhen","Office Romance","Fall for Me","Ikka","Toaster","Hit: 3rd Case","Voice of Isabella","Lost in Starlight"];
  let pick=null;
  const box=document.getElementById("movies");
  films.forEach(f=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=f;
    b.onclick=()=>{ pick=f; [...box.children].forEach(c=>c.classList.remove("on")); b.classList.add("on"); };
    box.appendChild(b);
  });

  // the (increasingly desperate) No button
  const noLines=["No 🙈","Are you sure? 🥺","You don't want a movie with me? 😳",
    "Are you sure sure? 🥹","Really really sure?? 💔","Think of the popcorn… 🍿",
    "My heart can't take this 😭","Okay… last chance 👀"];
  let n=0;
  const yes=document.getElementById("yes"), no=document.getElementById("no");
  function nope(){
    no.textContent = noLines[Math.min(n,noLines.length-1)]; n++;
    yes.style.fontSize = Math.min(2.6, 1.1 + n*0.22) + "rem";   // Yes grows (capped)
    no.style.fontSize = Math.max(0.72, 1 - n*0.04) + "rem";     // No shrinks a touch
    no.style.transform = `rotate(${(Math.random()*16-8)}deg)`;  // little wobble in place
    document.getElementById("hint").textContent = n>3 ? "(the No button is getting nervous…)" : "pick something you fancy 👇";
  }

  function yay(){
    // ✏️ EDIT THIS LINE — your secret message to Loduuuuuu:
    const secretNote = "p.s. you're my favourite person to do nothing with 🤍";
    const movie = pick ? `We're watching “${pick}” 🎥` : "You choose the movie, I'll bring the snacks 🍫";
    document.querySelector(".card").innerHTML =
      `<div style="font-size:3rem">🥳💖</div>
       <h1>Yayyy! It's a date tonight!</h1>
       <p class="sub" style="font-size:1.05rem">${movie}</p>
       <p style="color:#c65e83;font-style:italic;margin:14px 0 4px">${secretNote}</p>
       <div style="font-size:2rem">🌷🧸🌷</div>`;
    for(let i=0;i<26;i++){
      const h=document.createElement("div"); h.className="heart";
      h.textContent=["💖","💕","💗","🌸","✨"][i%5];
      h.style.left=Math.random()*100+"vw"; h.style.top=(60+Math.random()*30)+"vh";
      h.style.animationDelay=(Math.random()*.5)+"s";
      document.body.appendChild(h);
    }
  }
</script>
</body>
</html>
